version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LLM_API_BASE=${LLM_API_BASE:-http://101.251.216.47/8411/v1}
      - LLM_API_KEY=${LLM_API_KEY:-sk-empty}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-Qwen3-Coder-Next}
      - PORT=8000
    restart: unless-stopped
